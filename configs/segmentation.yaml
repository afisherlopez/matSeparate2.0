#default configuation for segmentation pipieline
classifier: legacy_hgnn  
run_dir: runs/c1_hgnn_baseline/avg_init_20260529_004313
checkpoint: null         
device: cpu          #just for non-VM runs because of the annoying MPS thing

sampling:
  type: sliding         
  patch_size: 224       
  window_size: 128      # paper main MINC-S config
  window_area_pct: null 
  stride: 32            
  pad_mode: reflect
  batch_size: 32
  min_patches: null     
  max_patches: null     

upsample:
  mode: bilinear
  align_corners: false
  renormalize: true

crf:
  backend: superpixel  # paper default (SLIC); dense CRF supported but too slow
  n_iterations: 7
  gaussian_sxy: 3
  bilateral_sxy: 60
  bilateral_srgb: 13
  gaussian_compat: 3
  bilateral_compat: 10
  taxonomy_aware_compat: true
  superpixel_method: slic
  superpixel_n_segments: 400

level:
  target: leaf          
  shallow_leaf: keep   

objects:
  bg_threshold: 0.0     
  connectivity: 8      
  min_object_area: 64   
  morph_close: false    
  morph_close_radius: 2

output:
  write_color_viz: true
  write_instance_pngs: false
  minc_crosswalk: null  
